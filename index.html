<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Nepal Weather</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=Noto+Sans+Devanagari:wght@400;600;700&family=Share+Tech+Mono&display=swap">
<style>
/* Layout: instrument-panel dashboard. Main column (map + readout, forecast, province lists) with a sticky right rail (warnings + news). */
:root{--time:#8a4b00;--timebg:#fdeccf;--loc:#0a7a5a;--ai:#6a37c9;--aibg:#ece3fb;--bg:#eef3f8;--panel:#ffffff;--panel2:#f4f7fb;--fg:#13233a;--mut:#5a6d85;--line:#d5dfeb;--acc:#0e6fb8;--acc2:#e8f2fb;
--ok:#1f9d55;--warn:#e6b400;--bad:#a61c1c;--okbg:#e3f5ea;--warnbg:#fff3c4;--badbg:#f8dad7;--warnfg:#6b5000;--badfg:#8f1717;--dbad:#7a1414;--dwarn:#f5d547;--dwarnfg:#3a2c00;--dok:#d9f2e3;--dokfg:#0f5a2f;--land:#dfe9f4;
--disp:"Barlow Condensed","Noto Sans Devanagari",system-ui,sans-serif;--body:"Barlow","Noto Sans Devanagari",system-ui,sans-serif;--mono:"Share Tech Mono",ui-monospace,Menlo,monospace;--shadow:0 1px 2px rgba(19,35,58,.06),0 6px 20px rgba(19,35,58,.06)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--time:#ffc46b;--timebg:#3a2a0b;--loc:#4fe0b0;--ai:#c4a4ff;--aibg:#2a1d4a;--bg:#0b1522;--panel:#112033;--panel2:#16293f;--fg:#e6eef8;--mut:#93a8c1;--line:#233b57;--acc:#5db4f2;--acc2:#123450;
--ok:#3ccf7a;--warn:#f2c230;--bad:#e5483f;--okbg:#10331f;--warnbg:#3a3208;--badbg:#4a1514;--warnfg:#f7d86b;--badfg:#ff9b94;--dbad:#7a1414;--dwarn:#e9c23c;--dwarnfg:#3a2c00;--dok:#134a2c;--dokfg:#bff0d3;--land:#1a2e46;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3);color-scheme:dark}}
:root[data-theme="dark"]{--time:#ffc46b;--timebg:#3a2a0b;--loc:#4fe0b0;--ai:#c4a4ff;--aibg:#2a1d4a;--bg:#0b1522;--panel:#112033;--panel2:#16293f;--fg:#e6eef8;--mut:#93a8c1;--line:#233b57;--acc:#5db4f2;--acc2:#123450;
--ok:#3ccf7a;--warn:#f2c230;--bad:#e5483f;--okbg:#10331f;--warnbg:#3a3208;--badbg:#4a1514;--warnfg:#f7d86b;--badfg:#ff9b94;--dbad:#7a1414;--dwarn:#e9c23c;--dwarnfg:#3a2c00;--dok:#134a2c;--dokfg:#bff0d3;--land:#1a2e46;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3);color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 28px;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wrap{max-width:1500px;margin:0 auto}
.num,.dig{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:.02em}
/* header */
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:14px 0}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1 1 280px}
.logo{width:38px;height:38px;flex:none;color:var(--acc)}
h1{font:700 clamp(24px,4vw,34px)/1 var(--disp);margin:0;letter-spacing:.01em}
.sub{color:var(--mut);font-size:13px;margin-top:3px}
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.status{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12.5px;color:var(--mut)}
.badge{font:700 11px var(--mono);letter-spacing:.08em;padding:2px 8px;border-radius:999px;color:#fff;background:var(--ok)}
.badge.sim{background:var(--warn);color:#201400}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pl 1.6s infinite}
.sim~.pulse{background:var(--warn)}
@keyframes pl{50%{opacity:.25}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;padding:6px 9px;display:grid;place-items:center;min-width:36px;min-height:34px;font-weight:600;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--acc);color:#fff}
.seg svg{width:17px;height:17px}
/* grid */
.grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.col{display:grid;gap:16px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px;min-width:0}
.card h2{font:700 19px var(--disp);letter-spacing:.03em;text-transform:uppercase;margin:0 0 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h2 small{font:500 12px var(--body);text-transform:none;letter-spacing:0;color:var(--mut)}
.top{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px}
/* map */
.mapbox{position:relative}
#map{width:100%;height:auto;display:block;max-height:640px}
#map .cell{stroke:var(--panel);stroke-width:.25;cursor:pointer;transition:fill-opacity .15s}
#map .cell:hover{stroke:var(--fg);stroke-width:.7}
#map .cell.sel{stroke:var(--fg);stroke-width:1}
#map .pb{fill:none;stroke:var(--fg);stroke-opacity:.5;stroke-width:.55;pointer-events:none}
#map .bord{fill:none;stroke:var(--fg);stroke-width:.9;pointer-events:none}
#map .dot{pointer-events:none}
#map .ptemp{font:600 2.9px var(--mono);fill:var(--fg);pointer-events:none;paint-order:stroke;stroke:var(--panel);stroke-width:.7}
.tip{position:absolute;pointer-events:none;z-index:5;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:8px 10px;min-width:150px;font-size:13px;opacity:0;transform:translateY(4px);transition:opacity .1s}
.tip.on{opacity:1;transform:none}
.tip b{font:700 16px var(--disp);display:block}
.tip .tt{font:22px var(--mono);line-height:1.1}
.tip .tt small{font-size:13px;color:var(--mut)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--mut);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.rs{width:16px;height:16px;flex:none}
.tb{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.provchip{font-size:12px;display:inline-flex;align-items:center;gap:5px;color:var(--mut)}
.provchip i{width:10px;height:10px;border-radius:3px;display:inline-block}
/* readout */
.rd-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.rd-h h3{font:700 clamp(26px,4vw,34px)/1 var(--disp);margin:0}
.rd-h p{margin:4px 0 0;color:var(--mut);font-size:13px}
.pill{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:13px;border-radius:999px;padding:4px 10px}
.pill.l0{background:var(--okbg);color:var(--ok)}.pill.l1{background:var(--warnbg);color:var(--warnfg)}.pill.l2{background:var(--badbg);color:var(--badfg)}
.lcd{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;align-items:center;margin:12px 0;padding:12px 14px;border-radius:12px;background:var(--panel2);border:1px solid var(--line)}
.lcd .big{font:clamp(46px,8vw,68px)/1 var(--mono);color:var(--acc)}
.lcd .big sup{font-size:.4em;vertical-align:top;margin-left:2px}
.lcd .alt{font:clamp(22px,4vw,30px) var(--mono);color:var(--mut);margin-top:2px}
.lcd .cond{display:flex;align-items:center;gap:10px;font:600 20px var(--disp)}
.lcd .cond .wi{width:46px;height:46px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.st{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.st span{display:block;font-size:11.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.st b{font:600 17px var(--mono);overflow-wrap:anywhere}
.aqibar{margin-top:10px;display:grid;gap:6px}
.aqirow{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.aqirow .v{font:34px/1 var(--mono)}
.scale{height:10px;border-radius:6px;position:relative;background:linear-gradient(90deg,#2fa84f 0 10%,#c9b21a 10% 20%,#e08a1e 20% 30%,#d6402f 30% 40%,#8a3fb5 40% 60%,#7a1f3d 60%)}
.scale i{position:absolute;top:-4px;width:4px;height:18px;border-radius:2px;background:var(--fg);box-shadow:0 0 0 2px var(--panel);transition:left .4s}
.reasons{display:grid;gap:6px;margin-top:10px}
.reason{display:flex;gap:8px;align-items:center;border-radius:10px;padding:7px 10px;font-size:13.5px}
.reason.l1{background:var(--warnbg)}.reason.l2{background:var(--badbg)}
.act{font-size:13px;color:var(--mut);margin-top:6px}
/* hourly + 7 day */
.hours{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.hr{flex:0 0 62px;text-align:center;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:6px 2px;font-size:12px}
.hr b{display:block;font:15px var(--mono)}
.hr small{color:var(--mut);font-family:var(--mono)}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.day{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center;display:grid;gap:4px;justify-items:center;min-width:0}
.day.t{border-color:var(--acc);background:var(--acc2)}
.day .dn{font:700 15px var(--disp);text-transform:uppercase;letter-spacing:.05em}
.day .dd{font-size:11.5px;color:var(--mut)}
.day .wi{width:34px;height:34px}
.day .hi{font:600 18px var(--mono)}
.day .lo{font:14px var(--mono);color:var(--mut)}
.day .f{font:12px var(--mono);color:var(--mut)}
.day .rn{font-size:12px;color:var(--acc);font-family:var(--mono)}
.day .wd{font-size:11px;color:var(--mut)}
/* rail */
.rail{display:grid;gap:16px;position:sticky;top:8px;max-height:calc(100vh - 16px);overflow:auto;scrollbar-width:thin}
.al{display:grid;gap:8px;max-height:340px;overflow:auto}
.ai{display:grid;grid-template-columns:20px 1fr auto;gap:8px;align-items:start;border-radius:10px;padding:8px 10px;border:0;text-align:left;width:100%}
.ai.l1{background:var(--warnbg)}.ai.l2{background:var(--badbg)}
.ai b{font:700 15px var(--disp);display:block}
.ai small{color:var(--mut);display:block;font-size:12px}
.ai .num{font-size:13px;white-space:nowrap}
.news{display:grid;gap:0;max-height:360px;overflow:auto}
.ni{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13.5px;animation:in .5s}
.ni:last-child{border:0}
.ni time{font:600 12px var(--mono);color:var(--time);background:var(--timebg);border-radius:6px;padding:2px 6px;height:fit-content}.loc{font-weight:700;letter-spacing:.04em;color:var(--loc);text-transform:uppercase}.ni.ai time{color:var(--ai);background:var(--aibg)}
@keyframes in{from{opacity:0;transform:translateY(-6px)}}
.ticker{overflow:hidden;white-space:nowrap;border-radius:10px;background:var(--panel2);border:1px solid var(--line);padding:6px 0;font-size:13px}
.ticker div{display:inline-block;padding-left:12px;padding-right:100%;animation:tk 70s linear infinite}
@keyframes tk{to{transform:translateX(-100%)}}
.ai-btn{margin-top:8px;border:1px solid var(--acc);color:var(--acc);background:transparent;border-radius:10px;padding:6px 12px;font-weight:600}
.ai-out{margin-top:8px;font-size:13.5px;white-space:pre-wrap}
/* provinces */
.prov{margin-top:14px}
.prov:first-of-type{margin-top:0}
.prov h3{font:700 20px var(--disp);margin:0 0 8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-bottom:6px;border-bottom:2px solid var(--pc)}
.prov h3 .cnt{margin-left:auto;display:flex;gap:8px;font:13px var(--mono)}
.prov h3 .cnt span{display:inline-flex;align-items:center;gap:3px}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:8px}
.dc{display:grid;grid-template-columns:18px 1fr;gap:2px 8px;align-items:center;border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:8px 10px;text-align:left;min-width:0;border-left-width:4px}
.dc.l0{border-left-color:var(--ok)}.dc.l1{border-left-color:var(--warn);background:var(--warnbg)}.dc.l2{border-left-color:var(--bad);background:var(--badbg)}
.dc:hover,.dc.sel{border-color:var(--acc)}
.dc .n{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dc .v{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline;gap:6px;font-family:var(--mono)}
.dc .v b{font-size:19px;font-weight:400}
.dc .v em{font-style:normal;color:var(--mut);font-size:14px}
.dc .m{grid-column:1/-1;display:flex;justify-content:space-between;font-size:11.5px;color:var(--mut);font-family:var(--mono)}
.dc .wi{width:18px;height:18px}
footer{color:var(--mut);font-size:12px;margin-top:20px;max-width:900px}
.sk{opacity:.5}
@media (max-width:1100px){.grid{grid-template-columns:minmax(0,1fr)}.rail{order:-1}.news{max-height:220px}.rail{position:static;max-height:none;overflow:visible;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}.rail .card.full{grid-column:1/-1}}
@media (max-width:820px){.top{grid-template-columns:minmax(0,1fr)}.days{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:480px){.days{grid-template-columns:repeat(2,minmax(0,1fr))}.lcd{grid-template-columns:1fr}.card{padding:12px}.dgrid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}}
@media (prefers-reduced-motion:reduce){*:not(.wi):not(.wi *){animation:none!important;transition:none!important}}

/* animated weather icons */
.wi{overflow:visible}
.a-rays{transform-box:view-box;transform-origin:12px 12px;animation:spin 16s linear infinite}
.a-pulse{animation:pulse 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.a-drift{animation:drift 5s ease-in-out infinite alternate}
.a-drop{animation:drop 1s linear infinite}
.a-flake{animation:flake 2.6s linear infinite;transform-box:fill-box;transform-origin:center}
.a-bolt{animation:bolt 2.2s infinite}
.a-fog{animation:fog 4s ease-in-out infinite alternate}
.d2,.f2{animation-delay:-.35s}.d3,.f3{animation-delay:-.7s}.f4{animation-delay:-1.1s}.f1{animation-delay:-.2s}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{transform:scale(1.1)}}
@keyframes drift{from{transform:translateX(-2px)}to{transform:translateX(2px)}}
@keyframes drop{0%{transform:translateY(-3px);opacity:0}25%{opacity:1}100%{transform:translateY(5px);opacity:0}}
@keyframes flake{0%{transform:translate(-1.5px,-3px);opacity:0}25%{opacity:1}100%{transform:translate(2px,5px);opacity:0}}
@keyframes bolt{0%,55%,100%{opacity:1}60%{opacity:.1}65%{opacity:1}72%{opacity:.2}78%{opacity:1}}
@keyframes fog{from{transform:translateX(-2px);opacity:.5}to{transform:translateX(2px);opacity:1}}
/* navigation */
.navcard .pt{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.pt button{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:7px 11px;font-weight:600;border-bottom:3px solid var(--pc)}
.pt button[aria-selected="true"]{background:var(--acc);color:#fff;border-color:var(--acc);border-bottom-color:var(--pc)}
.pt .c{font:12px var(--mono);display:inline-flex;gap:3px;align-items:center}
.pt .rs{width:13px;height:13px}
.dnav{display:flex;gap:6px;flex-wrap:wrap}
.dnav button{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-left-width:4px;background:var(--panel2);border-radius:9px;padding:5px 9px;font-size:13.5px}
.dnav button.l0{border-left-color:var(--ok)}.dnav button.l1{border-left-color:var(--warn)}.dnav button.l2{border-left-color:var(--bad)}
.dnav button[aria-current="true"]{background:var(--acc2);border-color:var(--acc);font-weight:600}
.dnav .t{font:12px var(--mono);color:var(--mut)}
.dnav .rs{width:13px;height:13px}
/* page rows */
.row2{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start}
.row3{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;align-items:start}
.flist{display:grid;gap:6px}
.fr{display:grid;grid-template-columns:54px 34px 1fr auto;gap:8px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.fr.t{border-color:var(--acc);background:var(--acc2)}
.fr .dn2{font:700 15px var(--disp);text-transform:uppercase}.fr small{display:block;color:var(--mut);font-size:11.5px;font-weight:400;font-family:var(--body)}
.fr .wi{width:32px;height:32px}
.fr .tp{text-align:right;font-family:var(--mono);font-size:15px}.fr .tp span{display:block;font-size:12px;color:var(--mut)}
.fr .mid{font:12px var(--mono);color:var(--mut);min-width:0}.fr .mid b{color:var(--fg);font-weight:400;font-size:13px;display:block}
.tk{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:10px;min-width:0}
.tr{border:1px solid var(--line);border-left-width:4px;border-radius:10px;padding:8px 10px;background:var(--panel2);display:grid;gap:4px}
.tr.l0{border-left-color:var(--ok)}.tr.l1{border-left-color:var(--warn);background:var(--warnbg)}.tr.l2{border-left-color:var(--bad);background:var(--badbg)}
.tr .h{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.tr b{font:700 16px var(--disp)}.tr .h span.p{display:inline-flex;gap:5px;align-items:center;font-size:12.5px;font-weight:600}
.tr .m{display:flex;flex-wrap:wrap;gap:4px 12px;font:12.5px var(--mono);color:var(--mut)}
.tr small{color:var(--mut)}
.desk-sum{font-size:13.5px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:8px}
@media (max-width:900px){.row2{grid-template-columns:minmax(0,1fr)}}

.dnav .pl{flex:0 0 100%;font:700 14px var(--disp);text-transform:uppercase;letter-spacing:.05em;border-bottom:2px solid var(--pc);padding-top:6px;margin-top:2px}
.dnav .pl:first-child{padding-top:0;margin-top:0}
/* forecast motion */
.bar{height:6px;border-radius:4px;background:var(--line);position:relative;margin-top:5px}
.bar i{position:absolute;top:0;bottom:0;border-radius:4px;background:linear-gradient(90deg,#3b9ae1,#f2b01e 60%,#e8620c);transform-origin:left}
.anim .bar i{animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
.anim .fr{animation:rowin .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*70ms)}
.anim .fr .bar i{animation-delay:calc(var(--i)*70ms + .2s)}
.anim .hr{animation:rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*45ms)}
.fr.t{position:relative;overflow:hidden}
.fr.t::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);transform:translateX(-120%);animation:sheen 4.5s ease-in-out infinite;pointer-events:none}
.fr:hover{transform:translateX(3px);border-color:var(--acc)}
.fr{transition:transform .2s,border-color .2s}
.fr:hover .wi{transform:scale(1.18) rotate(-4deg)}.fr .wi{transition:transform .25s}
.hr:hover{transform:translateY(-3px)}.hr{transition:transform .2s}
@keyframes rowin{from{opacity:0;transform:translateX(26px) scale(.98)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes sheen{0%,60%{transform:translateX(-120%)}100%{transform:translateX(120%)}}

function trekCalc(k){
 const d=R.find(x=>x.en===k.d),dz=Math.max(0,k.hi-d.el)/1000,lapse=6.5*dz;
 const now=d.cur.t-lapse,low=d.days[0].tmin-lapse,wind=d.cur.wind*(1+k.hi/7000),gust=Math.max(d.cur.gust,d.days[0].gust)*(1+k.hi/7000);
 const rain=Math.max(d.days[0].rain,d.days[1].rain),snow=now<=1&&(d.cur.precip>0||d.days[0].rain>1);
 const storm=[95,96,99].includes(d.days[0].code),v=Math.pow(Math.max(wind,5),.16);
 const chill=now<=10?13.12+.6215*now-11.37*v+.3965*now*v:now;
 let lv=0;
 if(low<=-20||gust>=70||rain>=50||storm&&gust>=45)lv=2;else if(low<=-10||gust>=45||rain>=15||snow||storm)lv=1;
 const ams=k.hi>=5000?2:k.hi>=3500?1:0;
 const freeze=Math.round(d.el+d.cur.t/0.0065);
 const FL=["Solukhumbu","Mustang","Dolpa","Mugu"];let fl=-1;
 if(FL.includes(k.d)){const c=d.cur;fl=(c.gust>=45||[95,96,99].includes(c.code)||(c.vis!=null&&c.vis<3))?2:(c.cloud>=80||c.gust>=30||c.code>=51||(c.vis!=null&&c.vis<8))?1:0}
 let best=-1;for(let i=0;i<5;i++){const x=d.days[i];if(x.rain<4&&x.code<61&&x.gust<45){best=i;break}}
 const toMin=h=>{const m=/(\d+):(\d+)/.exec(h||"");return m?+m[1]*60+ +m[2]:null},a=toMin(d.days[0].sr),b=toMin(d.days[0].ss);
 return{d,now,low,wind,gust,lv,snow,best,ams,chill,freeze,fl,rain,uv:(d.days[0].uv||0)*(1+.1*k.hi/1000),day:a!=null&&b!=null?(b-a)/60:null};
}
function trekFrame(k,c,f){
 const d=c.d,ds=d.days.slice(0,1),lapse=6.5*Math.max(0,k.hi-d.el)/1000,gm=1+k.hi/7000;
 const low=Math.min(...ds.map(x=>x.tmin))-lapse,high=Math.max(...ds.map(x=>x.tmax))-lapse,rsum=ds.reduce((q,x)=>q+x.rain,0),gust=Math.max(...ds.map(x=>x.gust),d.cur.gust)*gm;
 const sn=ds.filter(x=>x.tmax-lapse<=1&&x.rain>1).length,storm=ds.some(x=>x.code>=95);
 const r=[],add=(lv,key)=>r.push({lv,k:key});
 if(low<=-20)add(2,"cold");else if(low<=-10)add(1,"cold");
 if(gust>=70)add(2,"wind");else if(gust>=45)add(1,"wind");
 if(rsum>=50)add(2,"rain");else if(rsum>=15)add(1,"rain");
 if(sn)add(1,"snowRisk");
 if(storm)add(gust>=45?2:1,"storm");
 r.sort((x,y)=>y.lv-x.lv);
 return{lv:r.reduce((m,x)=>Math.max(m,x.lv),0),r,low,high,rsum,gust,sn,days:ds,lapse};
}
function renderTreks(){
 const L=t(),f=RANGE,ft=c=>`${N(fmt(c,0))}°C / ${N(fmt(C2F(c),0))}°F`;
 const rows=TREKS.map((k,i)=>{const c=trekCalc(k);return{k,i,c,fr:trekFrame(k,c,f)}}).sort((x,y)=>y.fr.lv-x.fr.lv);
 const ai=AI.data&&AI.data.trek||[];
 $("treks").innerHTML=rows.map(({k,i,c,fr})=>{
  const gear=L.gearT[fr.low<=-15?3:fr.low<=-5?2:fr.low<=5?1:0]+(fr.rsum>=10?L.wet:"");
  const st=(a,b)=>`<div><span>${a}</span><b>${b}</b></div>`;
  const av=ai[i]?`<div class="aiL"><b style="font:700 11px var(--mono)">${L.aiTag}</b> ${hl(ai[i][lang]||ai[i].en||"")}</div>`:"";
  return `<div class="tr l${fr.lv}"><div class="h"><b>${lang==="ne"?k.ne:k.en}</b><span class="p">${RS[fr.lv]}${L.trail[fr.lv]}</span></div>
  <small>${hl(nm(c.d))} · ${L.top}: <span class="num">${N(k.hi)} m</span></small>
  ${fr.r.length?`<div class="why">${fr.r.map(x=>L.r[x.k]).join(" · ")}</div>`:""}
  <div class="grid2">${st(L.today,ft(c.now))}${st(L.night,ft(fr.low))}${st(L.gust,`${N(fmt(fr.gust,0))} ${L.unitKm}`)}${k.hi>=3500?st(L.ams,L.amsL[c.ams]):""}</div>
  <div class="tip2"><b style="font-size:11px;text-transform:uppercase;color:var(--mut)">${L.gear}</b> ${gear}</div></div>`}).join("");
 $("trekNote").textContent=L.trekNote;
}
/* ===== APP: update loop + init ===== */
const CUR_EVERY=5*60e3,FC_EVERY=60*60e3;
let LD=[],lastCur=0,lastFcT=0,nextCur=0,nextFc=0,failCur=0,failFcT=0,lastErr="",cspBlocked=false;
document.addEventListener("securitypolicyviolation",e=>{if(/met\.no/.test(e.blockedURI||""))cspBlocked=true});
const errText=e=>cspBlocked?"blocked by the viewer's security policy":!e?"":e.name==="AbortError"?"timeout":/^\d+$/.test(e.message)?"HTTP "+e.message+(e.message==="429"?" (rate limited)":""):"connection blocked or offline";
const backoff=n=>Math.min(30e3*Math.pow(2,n),5*60e3);
const dayNow=d=>{const n=new Date(Date.now()+5.75*36e5),m=n.getUTCHours()*60+n.getUTCMinutes(),p=h=>{const x=/(\d+):(\d+)/.exec(h||"");return x?+x[1]*60+ +x[2]:null},a=p(d.days[0].sr),b=p(d.days[0].ss);return a!=null&&b!=null?m>=a&&m<b:m>=345&&m<1056};
function buildFromLD(){R=D.map((d,i)=>{const o=Object.assign({},d,LD[i]);o.cur=Object.assign({},o.cur,{day:dayNow(o)});return prep(o)})}
async function refreshLive(now){
 if(now<nextCur)return false;
 try{
  const{out,ok,err}=await fetchAllMet();
  out.forEach((r,i)=>{if(!r)return;const o=LD[i];o.cur=Object.assign({},o.cur,r.cur);o.days=r.days;o.hourly=r.hourly;o.sim=false});
  lastCur=lastFcT=now;failCur=0;nextCur=now+CUR_EVERY;lastErr=ok<D.length?`${D.length-ok} of ${D.length} districts not updated (${errText(err)})`:"";return true;
 }catch(e){failCur++;lastErr=errText(e);nextCur=now+(e&&e.message==="429"?5*60e3:backoff(failCur));return false}
}
async function update(){
 if(busy)return;busy=true;const now=Date.now();
 try{
  const before=R.map(d=>d.cur.code+"|"+Math.round(d.cur.t));
  const fetched=await refreshLive(now);if(lastCur)await refreshAQ(now);
  if(!lastCur){mode="sim";LD=D.map(d=>simulate(d,now))}else{mode="live";D.forEach((d,i)=>{const q=simulate(d,now);if(!LD[i].aqLive){LD[i].aqi=q.aqi;LD[i].pm25=q.pm25;LD[i].pm10=q.pm10}})}
  buildFromLD();
  if(fetched&&mode==="live"&&before.length){const n=R.filter((d,i)=>before[i]!==d.cur.code+"|"+Math.round(d.cur.t)).length;NEWS.unshift({f:L=>L.nUpd(N(n)),ts:now})}
  genNews();renderAll();
 }finally{busy=false;nextAt=Date.now()+TICK;lastUpd=Date.now()}
}
let lastUpd=0;
function clockTick(){
 const d=new Date(Date.now()+5.75*36e5),p=n=>String(n).padStart(2,"0");
 $("clock").textContent=N(`${p(d.getUTCHours())}:${p(d.getUTCMinutes())}:${p(d.getUTCSeconds())}`)+" NPT";
 const tg=nextCur||nextAt,s=Math.max(0,Math.ceil((tg-Date.now())/1000)),mm=String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
 $("nxt").textContent=tg?`${t().next} ${N(mm)}`:"";renderDates();renderAIStat();
 if(nextAt&&Date.now()>=nextAt&&!busy)update();
}
function setLang(l){lang=l;ls.set("np-lang",l);renderAll()}
function setTheme(m){
 const r=document.documentElement;
 if(m)r.setAttribute("data-theme",m);else r.removeAttribute("data-theme");
 $("bLight").setAttribute("aria-pressed",m==="light");$("bDark").setAttribute("aria-pressed",m==="dark");
 if(m)ls.set("np-theme",m);
}
function sysDark(){return matchMedia("(prefers-color-scheme: dark)").matches}
/* ---- AI layer: one call reviews warnings, desk bulletin and treks ---- */
function aiPayload(){
 const nmx=d=>`${d.en} / ${d.ne} (${PROV[d.p-1].en})`;
 const warns=R.filter(d=>d.fr.s.level>0).sort((a,b)=>b.fr.s.level-a.fr.s.level||a.en.localeCompare(b.en)).slice(0,10).map(d=>`[${["","MEDIUM","HIGH"][d.fr.s.level]}] ${nmx(d)}: ${d.fr.s.reasons.map(x=>x.k+" "+Math.round(x.v)).join(", ")}`).join("\n")||"none";
 const treks=TREKS.map((k,i)=>{const c=trekCalc(k),x=trekFrame(k,c,"s");return `${i}. ${k.en} (${k.d}, ${k.hi} m): ${["good","caution","avoid"][x.lv]}, now ${Math.round(c.now)}C, night low ${Math.round(x.low)}C, rain ${Math.round(x.rsum)} mm, gust ${Math.round(x.gust)} km/h`}).join("\n");
 const lo=R.reduce((a,b)=>b.cur.t<a.cur.t?b:a),hi=R.reduce((a,b)=>b.cur.t>a.cur.t?b:a);
 return `You are the live weather tracking editor for a Nepal weather site. Source: ${mode==="live"?"live MET Norway forecast":"climate-model estimate (live feed unavailable)"}, checked ${new Date().toISOString()}. Cover today only.\nWarnings:\n${warns}\nNow: coldest ${lo.en} ${lo.cur.t.toFixed(0)}C, hottest ${hi.en} ${hi.cur.t.toFixed(0)}C.\n${AI.prev?"Previous check: "+AI.prev+"\\nSay briefly what changed.\\n":""}Treks:\n${treks}\n\nUse ONLY these numbers. Do not claim anything from DHM Nepal. Keep district names exactly as given (English names in English text, Nepali names in Nepali text). Each text is one short sentence. Reply with JSON only: {"warn":{"en":"main risk and advice","ne":"same in Nepali"},"desk":[{"en":"headline","ne":".."},{"en":"..","ne":".."},{"en":"..","ne":".."}],"trek":[${TREKS.map(()=>'{"en":"..","ne":".."}').join(",")}]}`;
}
async function runAI(){
 if(!AI.s||AI.state==="busy"||AI.state==="denied"||!R.length)return;
 AI.state="busy";AI.try=Date.now();renderStatic();$("warnAI").innerHTML=aiLine("warn");renderAIStat();$("aiBtn").disabled=true;
 try{
  const j=await AI.s.json(aiPayload(),{modelTier:"quick",cache:false});
  if(j&&j.warn&&Array.isArray(j.desk)&&Array.isArray(j.trek)){AI.data=j;AI.ts=Date.now();AI.state="ok";AI.prev=`${new Date().toISOString().slice(11,19)} UTC, high ${R.filter(d=>d.fr.s.level==2).length}, medium ${R.filter(d=>d.fr.s.level==1).length}`}
  else AI.state=AI.data?"ok":"idle";
 }catch(e){const c=e&&e.code;if(c==="not_granted")AI.state="denied";else{AI.state=AI.data?"ok":"idle";if(c==="rate_limited")AI.hold=Date.now()+60e3}}
 $("aiBtn").disabled=false;renderStatic();renderAlerts();renderNews();renderTreks();renderAIStat();
}
async function initAI(){
 if(!(window.claude&&claude.use)){AI.state="na";renderAlerts();renderAIStat();return}
 AI.s=await claude.use("sample").catch(()=>null);
 if(!AI.s){AI.state="na";renderAlerts();renderAIStat();return}
 const b=$("aiBtn");b.hidden=false;b.onclick=()=>{if(AI.state==="denied")AI.state="idle";AI.hold=0;runAI()};
 runAI();
 setInterval(maybeAI,2000);
}
function maybeAI(){ // automatic: a new check every 20 s once the last one has finished; backs off a minute if rate limited
 if(!AI.s||AI.state==="busy"||AI.state==="denied"||document.hidden||Date.now()<AI.hold)return;
 const ref=AI.state==="ok"?AI.ts:AI.try;
 if(Date.now()-ref>=AI_EVERY)runAI();
}
function init(){
 const sl=ls.get("np-lang");lang=sl==="ne"?"ne":"en";
 const st=ls.get("np-theme");setTheme(st==="light"||st==="dark"?st:null);
 $("bEn").onclick=()=>setLang("en");$("bNe").onclick=()=>setLang("ne");
 $("bLight").onclick=()=>setTheme("light");$("bDark").onclick=()=>setTheme("dark");
 $("provTabs").addEventListener("click",e=>{const b=e.target.closest("[data-p]");if(b){navProv=+b.dataset.p;renderNav()}});
 $("pflex").addEventListener("click",e=>{const b=e.target.closest("[data-i]");if(b)select(+b.dataset.i,true)});
 $("alerts").addEventListener("click",e=>{const b=e.target.closest("[data-i]");if(b)select(+b.dataset.i,true)});

 renderStatic();
 LD=D.map(d=>simulate(d,Date.now()));buildFromLD();genNews();renderAll();   // complete first frame
 setInterval(clockTick,1000);clockTick();
 update();initAI();
 document.addEventListener("visibilitychange",()=>{if(!document.hidden&&nextAt&&Date.now()>nextAt)update()});
}
init();
</script>
